# ============================================================
# FinSight AI — Production Nginx Reverse Proxy
# Sits in front of both the React frontend (port 80) and the
# FastAPI backend (port 8000). All /api/* traffic is proxied
# to the backend; everything else serves the React SPA.
# ============================================================

# Rate-limiting zone — protects the API from abuse.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS in production
    # Comment this out if you're not using TLS yet:
    # return 301 https://$host$request_uri;

    # --- API proxy → FastAPI backend ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;

        # Security headers on API responses
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # --- Health check passthrough (no rate limit) ---
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # --- Static assets from React build (served by the frontend container) ---
    location /assets/ {
        proxy_pass http://frontend:80/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback — React Router handles client-side routing ---
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;

        # Security headers
        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         SAMEORIGIN always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }
}

