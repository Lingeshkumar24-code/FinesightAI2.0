version: "3.9"

# ============================================================
# FinSight AI — Production Compose Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required env vars (set in your host env or a .env.prod file):
#   JWT_SECRET            — long random secret (openssl rand -hex 32)
#   DATABASE_URL          — your Supabase/Postgres URL (postgresql+asyncpg://...)
#   CORS_ORIGINS          — JSON list of allowed frontend origins
#   OPENAI_API_KEY        — optional
#   GEMINI_API_KEY        — optional
#   OPENROUTER_API_KEY    — optional
#   DOMAIN                — your domain (e.g. finsight.yourdomain.com)
# ============================================================

services:
  backend:
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["https://${DOMAIN}"]'}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-baidu/ernie-5.5-flash-preview:free}
    # In production, don't expose the backend port directly — nginx proxies to it.
    ports: []
    expose:
      - "8000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    ports: []
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: always

  # Uncomment to enable automatic TLS via Let's Encrypt
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   command: certonly --webroot -w /var/www/certbot -d ${DOMAIN} --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email

  # Remove db service in production if using hosted Supabase/Postgres
  db:
    ports: []     # never expose DB port in production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  certbot_www:
  certbot_certs:
