services:
  # Backend FastAPI Web Service (Free Tier)
  - type: web
    name: finsight-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./finsight.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: TWELVEDATA_API_KEY
        value: ""
      - key: TWELVEDATA_BASE_URL
        value: https://api.twelvedata.com
      - key: MARKET_WATCHLIST
        value: SPY,QQQ,TLT,GLD,BTC/USD
      - key: MARKET_MAX_SYMBOLS
        value: "6"

  # Frontend Static Site
  - type: web
    name: finsight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://finsight-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
