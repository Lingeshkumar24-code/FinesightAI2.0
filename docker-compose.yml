version: "3.9"

# ============================================================
# FinSight AI — Local Dev Stack
# docker compose up --build
# docker compose --profile local-llm up --build  (adds Ollama)
# ============================================================

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@db:5432/finsight
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5175","http://localhost:4173","http://localhost"]'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-baidu/ernie-5.5-flash-preview:free}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/finsight-alerts}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-finsight-n8n-secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pg_data:/var/lib/postgresql/data
      - ./infra/supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # n8n Workflow Automation Engine
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - FINSIGHT_API_BASE_URL=http://backend:8000/api/v1
      - FINSIGHT_SERVICE_TOKEN=${FINSIGHT_SERVICE_TOKEN:-}
      - N8N_SHARED_SECRET=${N8N_SHARED_SECRET:-finsight-n8n-secret}
      # Workflow HTTP nodes read their URL/token/secret from $env, which
      # n8n blocks inside expressions unless this is disabled.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - finsight_n8n_data:/home/node/.n8n
      - ./infra/n8n:/backup/workflows:ro
    restart: unless-stopped

  # Optional self-hosted LLM (run with --profile local-llm)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - finsight_ollama_data:/root/.ollama
    profiles: ["local-llm"]
    restart: unless-stopped

volumes:
  finsight_pg_data:
  finsight_n8n_data:
  finsight_ollama_data:
