name: Deploy

# Deploy is manual (or tag-triggered) on purpose — this project ships
# with no cloud credentials, so the jobs below are a documented,
# ready-to-fill-in skeleton rather than something that runs
# automatically. Add the referenced secrets in repo Settings →
# Secrets, then flip `on:` to `push: tags: ["v*"]` once you're ready.

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend (Render/Fly/Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push backend image
        run: |
          echo "docker build -t $REGISTRY/finsight-backend:$GITHUB_SHA ./backend"
          echo "docker push $REGISTRY/finsight-backend:$GITHUB_SHA"
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Trigger deploy hook
        run: |
          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        run: |
          npm install
          npx vite build
        env:
          VITE_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  apply-db-migration:
    name: Apply Supabase schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema.sql against Supabase
        run: |
          echo "psql \"$SUPABASE_DB_URL\" -f infra/supabase/schema.sql"
          echo "(then, once, by hand or in a separate approved step: rls_policies.sql)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
